# Render Blueprint for the Beast Web Developer studio.
# Use: Render Dashboard -> New + -> Blueprint -> point at this repo,
# and every setting below (build, start, health check, env vars) is applied.
#
# The owner already deploys with the same commands by hand:
#   build: bun install --frozen-lockfile && bun run build
#   start: node .next/standalone/server.js
# This file adds the two things the manual setup is missing:
# a Health Check Path and the NODE_VERSION pin.

services:
  - type: web
    name: beast-web-developer
    runtime: node
    plan: free
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node .next/standalone/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: default
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: BEAST_DATA_DIR
        value: /opt/render/project/src/data
      # Insurance for the 512 MB free instance (mirrors whatsapp-qr-app's
      # working config). The Beast build compiles in ~10 s and is light,
      # but the cap prevents any surprise on busier days.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # REQUIRED — the root cause of the "No open ports detected" 502:
      # Render exports HOSTNAME=<pod-hostname>, and Next's standalone
      # server binds to it (proven Nov 12: banner shows the pod URL on
      # both Local and Network, Render never sees the port, the service
      # hibernates and the public URL 502s). Pin it to the public
      # interface.
      - key: HOSTNAME
        value: 0.0.0.0
      # GitHub vault — the durable archive. Create a fine-scoped token
      # (repo scope) and paste it in the Render dashboard Environment.
      # With it, every shelf site is auto-published to its own repo:
      # beast-site-<slug>-<seed6> — one atomic commit per publish.
      - key: BEAST_GH_TOKEN
        sync: false
      # AI key vault (optional): JSON array of API keys, e.g.
      # [{"id":"1","label":"groq","key":"gsk_...","addedAt":"2026-01-01"}]
      # Providers auto-detected by key shape; round-robin with cooldown.
      # Without it the deterministic solver runs everything (studio never stalls).
      - key: BEAST_AI_VAULT
        sync: false

    # ---- PERSISTENCE (paid plans only) ------------------------------------
    # Render's filesystem is EPHEMERAL on the free plan: every deploy and
    # restart wipes /data (the studio resets to DAY 1 and the owner name
    # resets). To keep the studio's memory across deploys, upgrade the plan
    # and switch to a mounted disk:
    #
    #   plan: starter
    #   disk:
    #     name: beast-data
    #     mountPath: /var/data
    #     sizeGB: 1
    #
    # ...and change the BEAST_DATA_DIR env var above to /var/data.
